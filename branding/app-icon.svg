<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Drawn on the same 24-unit grid as the titlebar icon, scaled to the tile,
       so the two are one mark at two sizes rather than two drawings. Stroke
       widths scale with it: 1.5 becomes 32, matching the weight the earlier
       wave-based mark used. -->
  <!-- translate is applied after the scale, so its units are the 512 tile, not
       the 24 grid. The mark is bottom-heavy (body low, antenna high), so its ink
       centroid lands 10.5px below centre; -10.5 centres the ink, not the box. -->
  <g transform="translate(0 -10.5) scale(21.3333)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.75" y="9.25" width="18.5" height="11.5" rx="2.25" stroke-width="1.5"/>
    <path d="M6 13h3.5M6 16h3.5M6 19h3.5" stroke-width="1.2"/>
    <circle cx="15.75" cy="16.25" r="2.5" stroke-width="1.5"/>
    <path d="M14.25 14.75l3 3" stroke-width="1.2"/>
    <path d="M7 9.25L17.5 4.25" stroke-width="1.4"/>
  </g>
</svg>
