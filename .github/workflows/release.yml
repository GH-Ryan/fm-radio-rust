# Builds the MSIX and publishes it to the Microsoft Store.
#
# This mirrors what tools/New-MsixPackage.ps1 does locally, plus the credential
# handshake the Store's submission API needs. Two ordering rules are load-bearing
# and both were learned the hard way:
#
#   * the frontend is built before cargo, because Tauri embeds dist/ at Rust
#     compile time and will otherwise ship a stale frontend with no error;
#   * the package goes through tools/New-MsixPackage.ps1 rather than winapp,
#     because winapp's own priconfig drops the per-language candidates in
#     Strings/ and the localised app name silently stops resolving.
#
# Prerequisites, none of which are in the repository:
#
#   * the app must already be published. The Store API updates existing
#     products; it cannot create one.
#   * a Microsoft Entra tenant associated with the Partner Center account.
#   * an Entra app registration added to Partner Center under
#     Account settings > User management > Microsoft Entra applications,
#     assigned the Manager role.
#   * repository secrets: AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID,
#     AZURE_AD_APPLICATION_SECRET, SELLER_ID.
#
# The Entra application secret is a credential: it is read from secrets and
# never echoed. It also expires, and the workflow fails at the reconfigure step
# once it does.

name: Release to Microsoft Store

on:
  # A tag is the normal trigger: the tag supplies the version, and the Store
  # rejects a submission whose version is not higher than the last.
  push:
    tags:
      - 'v*'
  # Manual runs take an explicit version, for a rebuild of something already
  # released without minting a new tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, four parts (e.g. 0.1.1.0)'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest

    env:
      # Partner Center ID for FM 电台, shown on the product's identity page.
      PRODUCT_ID: 9NCZJDND65GH

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # Tags are v1.2.3 and the manifest wants 1.2.3.0, so the leading v is
          # dropped and a revision is appended when the tag has only three parts.
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Unusable version '$v': expected 1.2.3 or 1.2.3.4"
          }
          $parts = $v.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $v = ($parts[0..3] -join '.')
          Write-Host "Package version: $v"
          "value=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build executable
        run: cargo build --release --features custom-protocol

      - name: Test
        run: cargo test --release

      - name: Generate signing certificate
        id: cert
        shell: pwsh
        run: |
          # The publisher subject has to match the manifest's Identity/@Publisher
          # or the package is rejected, so it is read from the manifest rather
          # than written out again here.
          $manifest = Get-Content Package.appxmanifest -Raw
          $publisher = [regex]::Match($manifest, 'Publisher="([^"]+)"').Groups[1].Value
          if (-not $publisher) { throw 'No Publisher in Package.appxmanifest' }
          Write-Host "Publisher: $publisher"

          # The Code Signing EKU is required; signtool refuses a certificate
          # without it. This certificate is a container for the signature only:
          # the Store re-signs the package with the publisher's own certificate,
          # so it is deliberately not trusted on the runner.
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -KeyUsage DigitalSignature `
            -FriendlyName 'FM Radio CI' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')

          $pfx = Join-Path $env:RUNNER_TEMP 'ci-cert.pfx'
          $password = [guid]::NewGuid().ToString('N')
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString $password -Force -AsPlainText) | Out-Null

          "path=$pfx" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        run: |
          ./tools/New-MsixPackage.ps1 `
            -Version '${{ steps.version.outputs.value }}' `
            -CertPath '${{ steps.cert.outputs.path }}' `
            -CertPassword '${{ steps.cert.outputs.password }}'

      - name: Remove the signing certificate
        if: always()
        shell: pwsh
        run: |
          # Leaves nothing reusable behind on the runner.
          $pfx = '${{ steps.cert.outputs.path }}'
          if ($pfx -and (Test-Path $pfx)) { Remove-Item $pfx -Force }
          Get-ChildItem 'Cert:\CurrentUser\My' |
            Where-Object { $_.FriendlyName -eq 'FM Radio CI' } |
            Remove-Item -Force

      - name: Upload the package as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ steps.version.outputs.value }}
          path: msix/build/*.msix
          if-no-files-found: error

      - name: Set up the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Store credentials
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish to the Store
        shell: pwsh
        run: |
          $msix = (Get-ChildItem msix/build/*.msix | Select-Object -First 1).FullName
          Write-Host "Uploading $msix"
          msstore publish $msix -id $env:PRODUCT_ID

      # Deliberately no listing/metadata step here. Store listing text and
      # screenshots are not carried in the package, and the metadata endpoint
      # replaces the whole listing document rather than patching it, so a
      # mistake there silently drops fields. It gets its own workflow once there
      # is a baseline metadata.json to diff against.
