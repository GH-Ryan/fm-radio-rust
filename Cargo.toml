[package]
name = "fm-radio"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1.0", features = ["full"] }
rodio = { version = "0.19", features = ["default"] }
symphonia = { version = "0.5", features = ["mp3", "vorbis", "flac", "wav", "aac"] }
dirs = "5.0"
once_cell = "1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
url = "2.5"
fastrand = "2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "fm-radio"
path = "src/main.rs"